[project]
name = "taxassistant"
version = "0.1.0"
description = "Chatbot tra cuu phap luat thue Viet Nam"
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# cần từ bước "Lấy văn bản luật về"
ingest = ["httpx>=0.27", "lxml>=5.2", "pypdf>=5.0"]
# cần từ bước "Trả lời"
# điều phối pipeline dữ liệu (app/pipeline)
pipeline = ["dagster>=1.13,<1.14", "dagster-webserver>=1.13,<1.14"]
answer = ["anthropic>=0.40", "fastapi>=0.115", "uvicorn[standard]>=0.30", "jinja2>=3.1"]

# Chỉ app/ là code. Không có dòng này, setuptools thấy thư mục data/ (văn bản tải về)
# và từ chối cài.
[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
