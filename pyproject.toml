[project]
name = "taxassistant"
version = "0.1.0"
description = "Chatbot tra cuu phap luat thue Viet Nam"
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# cần từ bước "Lấy văn bản luật về"
ingest = [
    "httpx>=0.27",
    "lxml>=5.2",
    # File đính kèm (.doc/RTF/PDF) do Apache Tika 4.1.0 đọc — chương trình Java ngoài Python, đường dẫn trong .env
    # (JAVA_EXE, TIKA_APP_JAR; docs/architecture.md, Đọc file đính kèm).
]
# điều phối pipeline dữ liệu (app/pipeline)
pipeline = ["dagster>=1.13,<1.14", "dagster-webserver>=1.13,<1.14"]
# luồng trả lời (app/answer). LangGraph ghim đúng phiên bản: thư viện đổi nhanh, checkpoint lưu dạng đóng gói.
answer = [
    "langgraph==1.2.16",
    "langgraph-checkpoint-postgres==3.2.0",
    "httpx>=0.28,<0.29",
    # guardrail g (kiểm câu kết luận có được căn cứ ủng hộ — cách AlignScore, model NLI chạy CPU).
    # Chạy bản ONNX (scripts/convert_nli_to_onnx.sh chuyển một lần, ở môi trường riêng) — không cần torch, transformers.
    "onnxruntime==1.31.0",
    "tokenizers>=0.23,<0.24",
    "numpy>=2.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
]
# bộ đo ngoại tuyến (giám khảo LLM) — không dùng trong app
eval = ["anthropic>=0.40"]

# Chỉ đóng gói thư mục app/; data/ là dữ liệu tải về, không phải mã nguồn.
[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
