<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Tax Assistant{% endblock %}</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='16' fill='%231f5fd1'/%3E%3Ctext x='16' y='22' font-size='17' text-anchor='middle' fill='white'%3E%E2%9A%96%3C/text%3E%3C/svg%3E">
  <script>
    // Sáng / tối đặt TRƯỚC khi trang hiện — không chớp trắng. Mặc định theo máy; lựa chọn lưu ở localStorage chỉ là
    // tiện ích (trình duyệt chặn thì vẫn chạy theo máy). docs/ui-context.md, Phong cách.
    (function () {
      let saved = null;
      try { saved = localStorage.getItem("theme"); } catch (error) { /* bị chặn → theo máy */ }
      const dark = saved ? saved === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
      document.documentElement.dataset.theme = dark ? "dark" : "light";
    })();
  </script>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
<svg class="icon-sprite" aria-hidden="true">
  <symbol id="i-panel" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/></symbol>
  <symbol id="i-new" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></symbol>
  <symbol id="i-chart" viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/></symbol>
  <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
  <symbol id="i-moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></symbol>
  <symbol id="i-send" viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></symbol>
  <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12l5 5L20 7"/></symbol>
</svg>
<div class="shell">
  <aside class="sidebar" id="sidebar" aria-label="Thanh bên">
    <div class="sidebar-top">
      <a class="brand" href="/hoi"><span class="brand-mark" aria-hidden="true">⚖</span>Tax Assistant</a>
      <button type="button" class="icon-button" data-toggle-sidebar aria-label="Đóng thanh bên" title="Đóng thanh bên">
        <svg class="icon"><use href="#i-panel"/></svg></button>
    </div>
    <form method="post" action="/hoi/moi">
      <button type="submit" class="nav-item"><svg class="icon"><use href="#i-new"/></svg>Cuộc hội thoại mới</button>
    </form>
    <p class="sidebar-heading">Gần đây</p>
    <ul class="threads">
      {% for t in threads %}
      <li><a href="/hoi?hoi_thoai={{ t.thread_id }}" title="{{ t.ten }}"
             {% if trang == 'hoi' and t.thread_id == current_thread %}aria-current="true"{% endif %}>{{ t.ten }}</a></li>
      {% else %}
      <li class="threads-empty">Chưa có cuộc hội thoại nào</li>
      {% endfor %}
    </ul>
    <div class="sidebar-bottom">
      <a class="nav-item" href="/hieu-nang" {% if trang == 'hieu_nang' %}aria-current="page"{% endif %}>
        <svg class="icon"><use href="#i-chart"/></svg>Hiệu năng</a>
      <button type="button" class="nav-item" id="theme-toggle">
        <svg class="icon theme-icon-dark"><use href="#i-moon"/></svg><svg class="icon theme-icon-light"><use href="#i-sun"/></svg>
        <span class="theme-label-dark">Giao diện tối</span><span class="theme-label-light">Giao diện sáng</span></button>
      <p class="sidebar-foot">Bản thử nghiệm · dữ liệu từ cổng Bộ Tư pháp, congbao.chinhphu.vn, www.chinhphu.vn</p>
    </div>
  </aside>
  <div class="backdrop" data-toggle-sidebar></div>

  <div class="main">
    <header class="topbar">
      <button type="button" class="icon-button open-sidebar" data-toggle-sidebar aria-label="Mở thanh bên" title="Mở thanh bên">
        <svg class="icon"><use href="#i-panel"/></svg></button>
      <nav class="tabs" aria-label="Chế độ">
        <a href="/hoi" {% if trang == 'hoi' %}aria-current="page"{% endif %}>Hỏi đáp</a>
        <a href="/tra-cuu" {% if trang == 'tra_cuu' %}aria-current="page"{% endif %}>Tra cứu</a>
      </nav>
      <form method="post" action="/hoi/moi" class="topbar-new">
        <button type="submit" class="icon-button" aria-label="Cuộc hội thoại mới" title="Cuộc hội thoại mới">
          <svg class="icon"><use href="#i-new"/></svg></button>
      </form>
    </header>
    {% block content %}{% endblock %}
  </div>
</div>
<script src="/static/app.js"></script>
</body>
</html>
